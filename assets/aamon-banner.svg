<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Aamon — an agentic web penetration tester">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080406"/>
      <stop offset="0.5" stop-color="#160709"/>
      <stop offset="1" stop-color="#2c0c08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#ff6a35" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#c0381a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c0381a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sigilGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffce73"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#e03a1c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4ea"/>
      <stop offset="0.55" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#ff8f5a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- faint ritual grid -->
  <g stroke="#ff6a3d" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="470" y1="0" x2="470" y2="380"/>
  </g>

  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- legions: lines of spawned probes fanning from the sigil toward a breach -->
  <g stroke="url(#ember)" stroke-opacity="0.28" stroke-width="1.4" fill="none">
    <path d="M190 190 C 300 70, 360 70, 430 92"/>
    <path d="M190 190 C 300 120, 360 128, 432 140"/>
    <path d="M190 190 C 300 160, 360 170, 432 182"/>
    <path d="M190 190 C 300 228, 360 234, 432 230"/>
    <path d="M190 190 C 300 300, 360 300, 430 282"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="430" cy="92" r="3.6" fill-opacity="0.85"/>
    <circle cx="432" cy="140" r="3.6" fill-opacity="0.85"/>
    <circle cx="432" cy="182" r="3.6" fill-opacity="0.85"/>
    <circle cx="432" cy="230" r="3.6" fill-opacity="0.85"/>
    <circle cx="430" cy="282" r="3.6" fill-opacity="0.85"/>
  </g>

  <!-- the breach: a seam in the wall the legions find a way through -->
  <g>
    <line x1="452" y1="60" x2="452" y2="320" stroke="#6f2214" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M452 150 l22 40 l-22 40" fill="none" stroke="url(#ember)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- goetic sigil medallion -->
  <circle cx="190" cy="190" r="104" fill="url(#sigilGlow)"/>
  <g transform="translate(190 190)" fill="none" stroke="url(#ember)" stroke-linecap="round">
    <circle r="82" stroke-width="2.6" stroke-opacity="0.95"/>
    <circle r="70" stroke-width="1" stroke-opacity="0.4"/>
    <circle r="30" stroke-width="1" stroke-opacity="0.5"/>
    <!-- tick marks around the ring -->
    <g stroke-width="2" stroke-opacity="0.6">
      <line x1="0" y1="-82" x2="0" y2="-70"/>
      <line x1="0" y1="82" x2="0" y2="70"/>
      <line x1="-82" y1="0" x2="-70" y2="0"/>
      <line x1="82" y1="0" x2="70" y2="0"/>
      <line x1="58" y1="-58" x2="49" y2="-49"/>
      <line x1="-58" y1="-58" x2="-49" y2="-49"/>
      <line x1="58" y1="58" x2="49" y2="49"/>
      <line x1="-58" y1="58" x2="-49" y2="49"/>
    </g>
    <!-- inverted star + rotated square -->
    <path d="M0 -58 L13.6 -18.8 L55.2 -18.8 L21.5 7.2 L34.1 46.9 L0 22 L-34.1 46.9 L-21.5 7.2 L-55.2 -18.8 L-13.6 -18.8 Z"
          transform="rotate(180)" stroke-width="2" stroke-opacity="0.8"/>
    <rect x="-24" y="-24" width="48" height="48" transform="rotate(45)" stroke-width="1.4" stroke-opacity="0.55"/>
    <!-- central flame -->
    <path d="M0 16 C -14 4, -9 -10, 0 -20 C 9 -10, 14 4, 0 16 Z" fill="url(#ember)" stroke="none"/>
  </g>

  <!-- ember spark particles -->
  <g fill="#ffb347">
    <circle cx="560" cy="300" r="1.8" fill-opacity="0.7"/>
    <circle cx="720" cy="86" r="1.5" fill-opacity="0.6"/>
    <circle cx="905" cy="300" r="2" fill-opacity="0.65"/>
    <circle cx="1040" cy="110" r="1.6" fill-opacity="0.55"/>
    <circle cx="990" cy="296" r="1.4" fill-opacity="0.5"/>
    <circle cx="640" cy="96" r="1.3" fill-opacity="0.5"/>
  </g>

  <!-- wordmark + type block (textLength pins each line so nothing can overflow) -->
  <text x="474" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700"
        fill="url(#word)" textLength="548" lengthAdjust="spacingAndGlyphs">AAMON</text>

  <rect x="476" y="214" width="548" height="2" fill="url(#rule)"/>

  <text x="476" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="2"
        fill="#ffcf92" textLength="548" lengthAdjust="spacingAndGlyphs">an agentic web penetration tester</text>

  <text x="476" y="282" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16"
        fill="#c79a86" textLength="520" lengthAdjust="spacingAndGlyphs">get in without credentials  ·  escalate  ·  solidify</text>

  <text x="476" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic"
        fill="#9a6251" textLength="612" lengthAdjust="spacingAndGlyphs">7th spirit of the Ars Goetia — a Grand Marquis of Hell commanding 40 legions</text>

  <rect width="1200" height="380" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1200" height="380" fill="none" stroke="#ff6a3d" stroke-opacity="0.12" stroke-width="2"/>
</svg>
